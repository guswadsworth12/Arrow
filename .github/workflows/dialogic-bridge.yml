name: Dialogic bridge
on:
  push:
    paths: ['addons/arrow_dialogic/**', 'services/**', 'scripts/**', 'tests/**', 'web/**', 'tools/**', 'export_presets.cfg', 'examples/dialogic_bridge/**', '.github/workflows/dialogic-bridge.yml']
  pull_request:
    paths: ['addons/arrow_dialogic/**', 'services/**', 'scripts/**', 'tests/**', 'web/**', 'tools/**', 'export_presets.cfg', 'examples/dialogic_bridge/**', '.github/workflows/dialogic-bridge.yml']
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and Dialogic
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          echo '0c1bc5e8dca8f892a9a5fd0628b742f399fbd520e5f0051ecac021c0aa4ea5a8f0d237c8ed6b767b2afda7f7a4b32001118f1b04a82e335a5e35b947a1217940  /tmp/godot.zip' | sha512sum --check
          unzip /tmp/godot.zip -d /tmp/godot
          git clone --depth 1 --branch 2.0-alpha-20 https://github.com/dialogic-godot/dialogic.git /tmp/dialogic
          test "$(git -C /tmp/dialogic rev-parse HEAD)" = e301e1bb5e62e6de22c6b7748c4372d0570bb4a7
      - name: Compiler, Dialogic parser and importer tests
        run: python3 tests/run_bridge_tests.py --godot /tmp/godot/Godot_v4.6-stable_linux.x86_64 --dialogic /tmp/dialogic --arrow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional story service dependencies
        run: python -m pip install -r services/story_service/requirements.lock
      - name: Story service HTTP, revision, concurrency and native validation tests
        env:
          ARROW_STORY_GODOT: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        run: python -m unittest discover -s tests/service -v

      - name: Install optional MCP dependencies
        run: python -m pip install -r services/story_mcp/requirements.lock
      - name: MCP stdio and Arrow UI interoperability tests
        env:
          ARROW_STORY_GODOT: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        run: python -m unittest discover -s tests/connectors -v

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service and browser test dependencies
        run: python -m pip install -r services/story_mcp/requirements.lock -r tests/web/requirements.txt
      - uses: actions/cache@v4
        id: web-toolchain
        with:
          path: /tmp/arrow-web-toolchain
          key: godot-web-linux-${{ hashFiles('tools/install_web_toolchain.py') }}
      - name: Install verified Godot web toolchain
        if: steps.web-toolchain.outputs.cache-hit != 'true'
        run: python tools/install_web_toolchain.py --directory /tmp/arrow-web-toolchain
      - name: Install browser and pinned Dialogic
        run: |
          python -m playwright install --with-deps chromium
          git clone --depth 1 --branch 2.0-alpha-20 https://github.com/dialogic-godot/dialogic.git /tmp/pwa-dialogic
          test "$(git -C /tmp/pwa-dialogic rev-parse HEAD)" = e301e1bb5e62e6de22c6b7748c4372d0570bb4a7
      - name: Export test and production PWAs
        run: |
          python tools/export_pwa.py --godot /tmp/arrow-web-toolchain/godot --template /tmp/arrow-web-toolchain/web_nothreads_release.zip --test-driver --output /tmp/arrow-pwa-tests
          python tools/export_pwa.py --godot /tmp/arrow-web-toolchain/godot --template /tmp/arrow-web-toolchain/web_nothreads_release.zip --output /tmp/arrow-pwa-production
      - name: Browser workflow, exports, persistence and offline PWA
        run: python tests/web/run_pwa_tests.py --web-root /tmp/arrow-pwa-tests --production-root /tmp/arrow-pwa-production --artifacts /tmp/pwa-browser-results --godot /tmp/arrow-web-toolchain/godot
      - name: Play the browser-downloaded export in real Dialogic
        run: python tests/web/check_dialogic_export.py /tmp/pwa-browser-results/dialogic.zip --godot /tmp/arrow-web-toolchain/godot --dialogic /tmp/pwa-dialogic --output /tmp/pwa-dialogic-export
      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-PWA
          path: /tmp/arrow-pwa-production/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PWA-validation
          path: |
            /tmp/pwa-browser-results/*.log
            /tmp/pwa-browser-results/*.png
            /tmp/pwa-dialogic-export/*.log
